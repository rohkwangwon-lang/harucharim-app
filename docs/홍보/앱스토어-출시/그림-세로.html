:root{--rice:#faf9f4;--ink:#282621;--soft:#5e5a4e;--line:#e4e1d6;--leaf:#3d5630;--leaf2:#628548;--wash:#eef2e6;--soy:#875326;--soywash:#f4e5d2;--paper:#fff}
*{box-sizing:border-box}html{-webkit-print-color-adjust:exact;print-color-adjust:exact}

.f{width:1080px;height:1920px;padding:110px 84px;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--rice),var(--wash))}

.lead{font-size:38px;line-height:1.5;margin:0}.lead em{font-style:normal;border-bottom:5px solid var(--soy)}
ul{list-style:none;padding:0;margin:60px 0 0;display:flex;flex-direction:column;gap:16px}li{font-size:33px;font-weight:500;padding-left:34px;position:relative}li::before{content:'';position:absolute;left:0;top:.6em;width:16px;height:16px;border-radius:50%;background:var(--leaf2)}
.phone{margin:70px auto 0;width:520px;border-radius:44px;overflow:hidden;border:14px solid #2b2a26;flex:1;min-height:0}.phone img{width:100%;display:block}
.bot{margin-top:auto;padding-top:40px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.bot p{margin:0;font-size:30px;color:var(--soft);line-height:1.45}.bot p b{color:var(--leaf)}.bot .qrw{width:210px;flex:none;padding:12px;background:#fff;border-radius:16px}
