name: Supabase 깨워 두기

# 여섯 시간마다(하루 네 번) 데이터베이스에 요청을 보낸다.
# 무료 요금제는 7일 동안 데이터베이스 활동이 적으면 멈추고, 문서의 기준은 '매일 몇 건' 이다.
# 하루 한 번 깨우던 때 2026-11 에 휴면 경고가 왔다. 멈췄는지 알리는 일은 expiry-watch.yml 이 맡는다.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 데이터베이스 깨우기
        # 공개 연결값만 쓴다. 주소와 키는 찍지 않고 응답 번호만 남긴다.
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
              "${SUPABASE_URL%/}/rest/v1/rpc/of_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H 'Content-Type: application/json' -d '{}') || code=000
            echo "요청 $i: $code"
            sleep 20
          done
