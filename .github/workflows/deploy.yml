name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        # 자체 도메인(harucharim.com)을 쓰므로 뿌리 경로에서 서빙된다.
        # 예전에는 github.io/<repo>/ 하위였기에 base 를 저장소 이름으로 맞춰 주었는데,
        # 지금 그대로 두면 시작주소와 서비스워커 경로가 한 칸씩 어긋난다.
        # public/CNAME 이 사용자 지정 도메인 설정을 배포마다 다시 심어 준다 —
        # 이 파일이 없으면 GitHub Pages 화면에서 넣은 도메인이 배포할 때마다 지워진다.
        run: npm run build
        env:
          # 문의·로그인용 Supabase 연결값.
          # 저장소 Settings → Secrets and variables → Actions 에 등록하면 주입된다.
          # 비어 있으면 문의·로그인만 꺼진 채로 빌드된다(나머지 기능은 정상).
          # 이 두 값은 브라우저에 노출되는 공개 키다. service_role 키는 절대 넣지 말 것.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
